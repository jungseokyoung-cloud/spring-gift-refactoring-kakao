spring.application.name=spring-gift
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
jwt.secret=a-string-secret-at-least-256-bits-long-for-testing
jwt.expiration=3600000
kakao.login.client-id=test
kakao.login.client-secret=test
kakao.login.redirect-uri=http://localhost:8080/api/auth/kakao/callback
